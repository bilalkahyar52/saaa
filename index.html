<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>berkay</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3eeff; --ink:#2a1747; --muted:#6b5a8a; --accent:#ff3d81; --accent-ink:#fff;
  --glow:#ffb800; --frame:#ffffff; --line:#d9ccf2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#150b26; --ink:#f6eeff; --muted:#b9a6d9; --accent:#ff4f93; --accent-ink:#1a0a2e;
    --glow:#ffc83d; --frame:#241440; --line:#3b2563;
  }
}
:root[data-theme="dark"]{
  --bg:#150b26; --ink:#f6eeff; --muted:#b9a6d9; --accent:#ff4f93; --accent-ink:#1a0a2e;
  --glow:#ffc83d; --frame:#241440; --line:#3b2563;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
main{width:100%; max-width:420px; text-align:center}
h1{font-size:clamp(2rem,9vw,2.8rem); margin:0 0 6px; line-height:1.05; font-weight:700}
.sub{margin:0 0 22px; color:var(--muted); font-size:1.05rem}
.stage{position:relative; width:100%; aspect-ratio:3/4; margin:0 auto 22px}
.frame{
  position:absolute; inset:0; border-radius:22px; background:var(--frame);
  border:2px dashed var(--line); overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  transition:border-color .6s, box-shadow .6s;
}
.frame .q{font-size:5.5rem; color:var(--line); font-weight:700; user-select:none}
.frame img{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  opacity:0; filter:brightness(4) blur(18px) saturate(0);
  transform:scale(1.08);
}
.frame.on{border:2px solid var(--glow); animation:pulse 2.4s ease-in-out 1s infinite alternate;
  box-shadow:0 0 30px 6px var(--glow)}
.frame.on img{
  opacity:1; filter:brightness(1) blur(0) saturate(1); transform:scale(1);
  transition:opacity 4.5s ease-out, filter 4.5s ease-out, transform 4.5s ease-out;
}
.frame.on .q{display:none}
@keyframes pulse{from{box-shadow:0 0 22px 4px var(--glow)}to{box-shadow:0 0 58px 16px var(--glow)}}
.say{min-height:2.2rem; font-size:1.55rem; font-weight:700; color:var(--accent); opacity:0; transition:opacity 1.2s ease .6s; margin:0 0 18px}
.say.on{opacity:1}
.go{
  font:inherit; font-weight:700; font-size:1.25rem; cursor:pointer; border:0;
  background:var(--accent); color:var(--accent-ink); padding:16px 34px; border-radius:999px;
  transition:transform .15s;
}
.go:active{transform:scale(.96)}
.go:focus-visible,.pick:focus-within{outline:3px solid var(--glow); outline-offset:3px}
.row{display:flex; gap:14px; justify-content:center; align-items:center; flex-wrap:wrap}
.pick{color:var(--muted); font-size:.95rem; cursor:pointer; text-decoration:underline; border-radius:6px}
.pick input{position:absolute; width:1px; height:1px; opacity:0}
@media (prefers-reduced-motion:reduce){
  .frame.on{animation:none}
  .frame.on img{transition-duration:.6s}
}

[hidden]{display:none!important}
.start{
  position:fixed; inset:0; z-index:5; width:100%; border:0; background:var(--bg); color:var(--accent);
  font:inherit; font-weight:700; font-size:clamp(3.2rem,17vw,8rem); line-height:1.05; text-align:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  transition:opacity .5s ease; -webkit-tap-highlight-color:transparent;
}
.start.out{opacity:0; pointer-events:none}
.start:focus-visible{outline:4px solid var(--glow); outline-offset:-12px}
</style>
</head>
<body>
<button class="start" id="start" type="button">Buraya tıklayın</button>
<main id="main" hidden>
  <div class="stage">
    <div class="frame" id="frame"><span class="q">?</span><img id="photo" alt="İfşa olan arkadaş"></div>
  </div>
  <p class="say" id="say" aria-live="polite">Oy sana gurban olurum</p>
  <button class="go" id="go" type="button">Tekrar</button>
</main>

var frame = document.getElementById("frame");
var photo = document.getElementById("photo");
var say = document.getElementById("say");
var go = document.getElementById("go");
var start = document.getElementById("start");
var main = document.getElementById("main");
photo.src = PHOTO_SRC;
var aud = new Audio(AUDIO_SRC);
aud.preload = "auto";

function reveal(){
  start.classList.add("out");
  main.hidden = false;
  void frame.offsetWidth;
  frame.classList.add("on"); say.classList.add("on");
  try{ aud.currentTime = 0; aud.play(); }catch(e){}
}
function reset(){
  frame.classList.remove("on"); say.classList.remove("on");
  try{ aud.pause(); aud.currentTime = 0; }catch(e){}
  main.hidden = true;
  start.classList.remove("out");
}
start.addEventListener("click", reveal);
go.addEventListener("click", reset);
